name: CI

# Every pull request and every change to main is type-checked, built and tested.
# Changes that reach main are then deployed to Cloud Run automatically.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Deploys run one at a time, in order
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/354315661892/locations/global/workloadIdentityPools/github/providers/movie-club-repo
          service_account: github-deployer@movie-club-502506.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
      - name: Build and deploy the server
        run: gcloud builds submit --config=cloudbuild.yaml --project=movie-club-502506 --quiet
