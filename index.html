<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Private Movie Club — Members Only Portal</title>

    <!-- Meta / SEO (Emphasizing Private Members-Only Portal & Snippet Protection) -->
    <meta name="description" content="Private members-only cinema society portal. Authorized member access required to view fortnightly movie schedules, selections, private session chronicles, and ratings." />
    <meta name="author" content="Private Movie Club" />
    <meta name="robots" content="index, follow, max-snippet:160, max-image-preview:large" />
    <meta name="googlebot" content="index, follow, max-snippet:160" />
    <meta name="theme-color" content="#1c2626" />

    <!-- Added to an iPhone Home Screen, the site opens full-screen like an app -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Movie Club" />

    <!-- Google Search & Browser Favicons (Google 48px square requirement, multi-res ICO & PNG, SVG, Apple Touch) -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=2" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png?v=2" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png?v=2" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=2" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=2" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="shortcut icon" href="/favicon.ico?v=2" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2" />
    <link rel="manifest" href="/site.webmanifest?v=2" />

    <!-- Structured Data for Search Engines -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Private Movie Club",
      "applicationCategory": "EntertainmentApplication",
      "operatingSystem": "All",
      "description": "Private members-only cinema society portal. Authorized member login required to access schedules, private chronicles, and club reviews.",
      "isAccessibleForFree": false
    }
    </script>

    <!-- Open Graph / Social Previews -->
    <meta property="og:site_name" content="Private Movie Club" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Private Movie Club — Members Only Portal" />
    <meta property="og:description" content="Private members-only cinema society portal. Authorized member access required to view schedules, voting, private session chronicles, and ratings." />
    <meta property="og:image" content="/og-image.jpg" />

    <!-- Twitter Card Previews -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Private Movie Club — Members Only Portal" />
    <meta name="twitter:description" content="Private members-only cinema society portal. Authorized member access required to view schedules, voting, private session chronicles, and ratings." />
    <meta name="twitter:image" content="/og-image.jpg" />
  </head>
  <body class="bg-[#050505] text-zinc-100 antialiased selection:bg-amber-500/20 selection:text-amber-300">
    <noscript>
      <div style="padding: 40px; font-family: sans-serif; text-align: center; color: #d4d4d8; background-color: #09090b;">
        <h1>Private Movie Club — Members Only Portal</h1>
        <p>This is a private, members-only cinema society portal. Authorized member login is required to access movie schedules, voting, session recaps, and reviews.</p>
      </div>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
