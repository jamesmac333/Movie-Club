<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Movie Club · A private film club</title>

    <!-- What Google and link previews show -->
    <meta name="description" content="A private film club that meets every second Friday at 7 pm. Members take turns picking the film, then everyone rates and reviews it." />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <link rel="canonical" href="https://www.movieclub.co.nz/" />
    <meta name="theme-color" content="#1c2626" />

    <!-- Added to an iPhone Home Screen, the site opens full-screen like an app -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Movie Club" />

    <!-- Google Search & Browser Favicons (Google 48px square requirement, multi-res ICO & PNG, SVG, Apple Touch) -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=2" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png?v=2" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png?v=2" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=2" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=2" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="shortcut icon" href="/favicon.ico?v=2" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2" />
    <link rel="manifest" href="/site.webmanifest?v=2" />

    <!-- Tells Google the site's name, so results say "Movie Club" rather than the web address -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Movie Club",
      "alternateName": "movieclub.co.nz",
      "url": "https://www.movieclub.co.nz/"
    }
    </script>

    <!-- Link previews in iMessage, WhatsApp and social apps -->
    <meta property="og:site_name" content="Movie Club" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.movieclub.co.nz/" />
    <meta property="og:title" content="Movie Club" />
    <meta property="og:description" content="A private film club that meets every second Friday at 7 pm. Members take turns picking the film, then everyone rates and reviews it." />
    <meta property="og:image" content="https://www.movieclub.co.nz/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Movie Club, a private film club, every second Friday at 7 pm" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body class="bg-[#1c2626] text-zinc-100 antialiased selection:bg-amber-500/20 selection:text-amber-300">
    <noscript>
      <div style="padding: 40px; font-family: Georgia, serif; text-align: center; color: #ede3d1; background-color: #1c2626;">
        <h1>Movie Club</h1>
        <p>A private film club that meets every second Friday at 7 pm. Members take turns picking the film, then everyone rates and reviews it. Members sign in to see the schedule, recaps and reviews.</p>
      </div>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
